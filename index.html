<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8f6ef">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<title>Trajet animé</title>
<style>
:root{--sea:#84d5ea;--mint:#c8f1d8;--mint2:#e8f6ef;--ink:#1f2a44;--mute:#6b7690;--road:#a9b3d9;--acc:#f2682c;--blue:#2b8fd6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--mint2);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
button{font:inherit;color:inherit;cursor:pointer}
#stage{flex:1;min-height:0;container-type:size;display:flex;justify-content:center;align-items:center;padding:8px 0 4px}
#wrap{position:relative;width:min(100cqw,56.25cqh);aspect-ratio:9/16}
#c{width:100%;height:100%;display:block;border-radius:20px;touch-action:none;background:var(--mint);box-shadow:0 10px 28px rgba(31,42,68,.2)}
#tools{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:10px}
.tool{width:42px;height:42px;border-radius:50%;border:0;padding:0;background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(31,42,68,.25);display:grid;place-items:center}
.tool.on{background:var(--acc);color:#fff}
.tool svg,#bPlay svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input[type=file]{display:none}
#sheet{background:#fff;border-radius:26px 26px 0 0;padding:0 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -8px 28px rgba(31,42,68,.14);display:grid;gap:8px}
#grip{width:100%;height:18px;background:none;border:0;padding:0;position:relative}
#grip::after{content:"";position:absolute;left:50%;top:7px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#d5dbe8}
.fold{display:grid;gap:8px}
#sheet.min .fold{display:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-width:60px;border:2px solid transparent;border-radius:14px;background:var(--mint2);padding:3px 6px 4px;display:grid;justify-items:center;gap:1px;font-weight:600;font-size:11px;color:var(--ink)}
.chip.on{border-color:var(--acc);background:#fff;box-shadow:0 0 0 3px rgba(242,104,44,.2)}
.chip canvas{width:44px;height:44px}
.chip i{display:block;width:48px;height:22px;margin:5px 0 3px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(31,42,68,.14)}
input[type=text]{width:100%;height:42px;border:0;border-radius:14px;background:var(--mint2);padding:0 14px;font:600 16px system-ui;color:var(--ink)}
input::placeholder{color:var(--mute);font-weight:500}
.row2{display:flex;gap:8px}
.pill{display:flex;align-items:center;gap:6px;background:var(--mint2);border-radius:14px;padding:0 12px;height:40px;font-weight:600;color:var(--mute)}
.pill input{width:44px;border:0;background:none;font:700 17px system-ui;color:var(--ink);text-align:right;padding:0}
.seg{display:flex;flex:1;background:var(--mint2);border-radius:14px;padding:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(31,42,68,.2)}
.acts{display:flex;gap:10px;align-items:center}
#bPlay{width:50px;height:50px;flex:0 0 50px;border-radius:50%;border:0;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(242,104,44,.4)}
#bPlay svg{fill:currentColor;stroke:none;width:24px;height:24px}
#bPlay .pa,#bPlay.on .pl{display:none}
#bPlay.on .pa{display:block}
.gpxbtn{flex:0 0 auto;height:50px;padding:0 16px;border-radius:25px;background:var(--mint);color:#0b4f33;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(11,79,51,.18);cursor:pointer}
.gpxbtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#bRec{flex:1;height:50px;border:0;border-radius:25px;background:var(--blue);color:#fff;font-weight:700;font-size:16px;box-shadow:0 4px 12px rgba(43,143,214,.4)}
#bRec:disabled{opacity:.6}
#msg{color:var(--mute);font-size:12.5px;line-height:1.25}
#dl[hidden]{display:none}
#dl{display:block;text-align:center;background:var(--mint);color:#0b5a3a;font-weight:700;border-radius:14px;padding:12px;text-decoration:none}
#ver{color:#9aa4bd;font-size:11px;text-align:center}
</style>
</head>
<body>
<div id="mgl" style="position:fixed;left:-9999px;top:0"></div>
<div id="stage"><div id="wrap">
  <canvas id="c"></canvas>
  <div id="tools">
    <button class="tool on" id="bDraw" aria-label="Tracer le trajet"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/></svg></button>
    <button class="tool" id="bUndo" aria-label="Annuler le dernier point"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tool" id="bClear" aria-label="Effacer le trajet"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>
</div></div>
<div id="sheet">
  <button id="grip" aria-label="Réduire ou agrandir le panneau"></button>
  <div class="fold">
    <div class="chips" id="trChips"></div>
    <div class="chips" id="stChips"></div>
    <input id="title" type="text" placeholder="Titre de la vidéo" maxlength="40">
    <div class="row2">
      <label class="pill"><input id="dur" type="number" value="12" min="3" max="120" aria-label="Durée en secondes"><span>secondes</span></label>
      <div class="seg" id="camSeg"></div>
    </div>
    <small id="ver">Version 11 · trois cartes, GPX en bas</small>
  </div>
  <div class="acts">
    <button id="bPlay" aria-label="Lecture"><svg class="pl" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><svg class="pa" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <label class="gpxbtn" aria-label="Importer un fichier GPX"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>GPX<input id="gpx" type="file" accept=".gpx,application/gpx+xml,text/xml"></label>
    <button id="bRec">Exporter la vidéo</button>
  </div>
  <div id="msg">Touchez la carte pour placer les points du trajet. Glissez pour déplacer, pincez pour zoomer.</div>
  <a id="dl" hidden>Télécharger la vidéo</a>
</div>
<select id="sty" hidden><option value="gm" selected>Simplifiée</option><option value="osm">Détaillée</option><option value="sat">Satellite</option></select>
<select id="mode" hidden><option value="car" selected>Voiture</option><option value="bike">Vélo</option><option value="moto">Moto</option><option value="boat">Bateau</option><option value="plane">Avion</option><option value="walk">À pied</option></select>
<select id="cam" hidden><option value="f" selected>Suit</option><option value="g">Globale</option></select>
<script>
const W=720,H=1280,cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
cv.width=W;cv.height=H;
let A=null,pts=[],L=[0],z=5,cx=.53,cy=.34,t=0,playing=false,drawMode=true;
const S=()=>256*2**z,sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mx=l=>(l+180)/360,my=a=>{a*=Math.PI/180;return(1-Math.log(Math.tan(a)+1/Math.cos(a))/Math.PI)/2};
const P=p=>[(p[0]-cx)*S()+W/2,(p[1]-cy)*S()+H/2];

/* tuiles OpenStreetMap */
const SRC={osm:(z,x,y)=>`https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
  sat:(z,x,y)=>`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`};
const STY={
  gm:{vec:1,a:'OpenFreeMap © OpenMapTiles © OpenStreetMap'},
  osm:{src:'osm',f:'none',a:'© OpenStreetMap'},
  sat:{src:'sat',f:'none',a:'Imagery © Esri'}};
const tc=new Map();let pend=0;
function tile(tz,x,y){const sy=STY[$('sty').value].src,k=sy+'/'+tz+'/'+x+'/'+y;let i=tc.get(k);
  if(!i){i=new Image();i.crossOrigin='anonymous';i.onload=()=>{i.ok=1;pend--;if(!playing)draw()};i.onerror=()=>pend--;pend++;i.src=SRC[sy](tz,x,y);tc.set(k,i)}
  return i}
const vec=()=>STY[$('sty').value].vec&&mglOK;
let mgl=null,mglOK=false,mk='';
function mpos(){const cw=$('mgl').clientWidth||W;return{center:[cx*360-180,Math.atan(Math.sinh(Math.PI*(1-2*cy)))*180/Math.PI],zoom:z-1+Math.log2(cw/W)}}
function syncMap(){if(!mglOK)return;const k=cx.toFixed(8)+','+cy.toFixed(8)+','+z.toFixed(4);if(k===mk)return;mk=k;mgl.jumpTo(mpos())}
const mglFrame=()=>Promise.race([new Promise(r=>{mgl.once('render',r);mgl.triggerRepaint()}),sleep(900)]);
const tl=async()=>{for(let i=0;i<80&&!mgl.areTilesLoaded();i++)await sleep(50)};
function vmap(){ctx.fillStyle='#c8f1d8';ctx.fillRect(0,0,W,H);if(mglOK){syncMap();ctx.drawImage(mgl.getCanvas(),0,0,W,H)}}
function gmStyle(st){
  const C={bg:'#c8f1d8',sea:'#84d5ea',wood:'#b3ecc9',park:'#a6e5bf',road:'#a9b3d9'},out=[];
  const pl=st.layers.filter(l=>l.type==='symbol'&&l['source-layer']==='place');
  let keep=pl.filter(l=>/city|town|village|capital|country/i.test(l.id||''));
  if(!keep.length)keep=pl.filter(l=>!/other|hamlet|suburb|neighbo|isolated|island|state|continent/i.test(l.id||''));
  const KP=new Set(keep.map(l=>l.id));
  for(const l of st.layers){
    const sl=l['source-layer'],id=l.id||'',p=l.paint=l.paint||{};
    if(l.type==='background'){p['background-color']=C.bg;out.push(l);continue}
    if(l.type==='symbol'){if(sl==='place'){const hm=JSON.stringify(l.filter||'').includes('hamlet'),cl=['match',['get','class'],['city','town','village','country','hamlet','isolated_dwelling'],true,false];l.filter=l.filter?['all',l.filter,cl]:cl;l.layout=l.layout||{};l.layout['text-field']=['coalesce',['get','name'],['get','name:latin']];delete l.layout['text-transform'];p['text-color']=hm?'#59627a':'#2b3140';p['text-halo-color']='#fff';p['text-halo-width']=1.6;delete p['text-halo-blur'];out.push(l)}continue}
    if(l.type==='fill'){
      if(sl==='water'){p['fill-color']=C.sea;p['fill-opacity']=1;delete p['fill-outline-color'];delete p['fill-pattern'];out.push(l)}
      else if(sl==='park'||sl==='landcover'){p['fill-color']=sl==='park'?C.park:C.wood;p['fill-opacity']=.75;delete p['fill-outline-color'];delete p['fill-pattern'];out.push(l)}
      continue}
    if(l.type==='line'){
      if(sl==='waterway'){p['line-color']=C.sea;out.push(l)}
      else if(sl==='transportation'&&!/casing|path|track|service|rail|pier|ferry/i.test(id)){p['line-color']=C.road;delete p['line-dasharray'];out.push(l)}
      else if(sl==='boundary'){p['line-color']='#9aa5c4';out.push(l)}
    }
  }
  st.layers=out;return st}
const loadScript=u=>new Promise((ok,ko)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=ko;document.head.appendChild(e)});
async function initVec(){
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js');
    const st=gmStyle(await(await fetch('https://tiles.openfreemap.org/styles/positron')).json());
    const el=$('mgl'),D=window.devicePixelRatio||1;el.style.width=Math.round(W/D)+'px';el.style.height=Math.round(H/D)+'px';
    mgl=new maplibregl.Map({container:el,style:st,center:[0,0],zoom:2,minZoom:-2,interactive:false,attributionControl:false,preserveDrawingBuffer:true,fadeDuration:0,maxTileCacheSize:400});
    mgl.on('render',()=>{if(!playing)draw()});
    await new Promise((ok,ko)=>{mgl.once('load',ok);setTimeout(ko,15000)});
    mglOK=true;mk='';draw();
  }catch(e){mglOK=false;if($('sty').value==='gm'){$('sty').value='osm';chips();draw()}$('msg').textContent='Carte simplifiée indisponible (réseau) : carte détaillée utilisée.'}}
function map(){
  if(STY[$('sty').value].vec){vmap();return}
  const tz=Math.max(1,Math.min(17,Math.round(z))),n=2**tz,sc=S()/n;
  ctx.fillStyle='#cfd8dc';ctx.fillRect(0,0,W,H);
  const x0=cx-W/2/S(),x1=cx+W/2/S(),y0=cy-H/2/S(),y1=cy+H/2/S();
  ctx.filter=STY[$('sty').value].f;
  for(let ty=Math.floor(y0*n);ty<=Math.floor(y1*n);ty++)for(let tx=Math.floor(x0*n);tx<=Math.floor(x1*n);tx++){
    if(ty<0||ty>=n)continue;const i=tile(tz,((tx%n)+n)%n,ty);
    if(i.ok)ctx.drawImage(i,(tx/n-cx)*S()+W/2,(ty/n-cy)*S()+H/2,sc+.5,sc+.5)}
}

/* trajet */
function changed(){A=null;L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));t=0;$('dl').hidden=true;draw()}
function head(){
  if(pts.length<2)return[...(pts[0]||[cx,cy]),1];
  const d=t*L[L.length-1];let i=1;while(i<L.length-1&&L[i]<d)i++;
  const f=Math.min(1,Math.max(0,(d-L[i-1])/((L[i]-L[i-1])||1)));
  return[pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f,pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f,i]}
function path(a,col,w){ctx.beginPath();a.forEach((p,i)=>{const q=P(p);i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])});ctx.strokeStyle=col;ctx.lineWidth=w;ctx.setLineDash($('mode').value==='plane'?[w*2.2,w*1.6]:[]);ctx.stroke();ctx.setLineDash([])}
function dot(p,r,col){const q=P(p);ctx.beginPath();ctx.arc(q[0],q[1],r,0,7);ctx.fillStyle=col;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke()}
function icon(m,A,X=ctx,K2){
  const K=K2||{car:58,bike:64,moto:60,boat:58,plane:74,walk:72}[m];
  X.save();X.rotate(A+Math.PI/2);X.scale(K,K);X.lineCap='round';X.lineJoin='round';
  const F=c=>{X.fillStyle=c;X.fill()};
  const rr=(x,y,w,h,r,c)=>{X.beginPath();X.roundRect(x-w/2,y-h/2,w,h,r);F(c)};
  const el=(x,y,a,b,c)=>{X.beginPath();X.ellipse(x,y,a,b,0,0,7);F(c)};
  const ln=(x1,y1,x2,y2,w,c)=>{X.beginPath();X.moveTo(x1,y1);X.lineTo(x2,y2);X.lineWidth=w;X.strokeStyle=c;X.stroke()};
  const pg=(a,c)=>{X.beginPath();a.forEach((p,i)=>i?X.lineTo(p[0],p[1]):X.moveTo(p[0],p[1]));X.closePath();F(c)};
  const sh=()=>{X.shadowColor='rgba(0,0,0,.38)';X.shadowBlur=16;X.shadowOffsetY=9},ns=()=>{X.shadowColor='transparent';X.shadowBlur=0;X.shadowOffsetY=0};
  const SK='#f2b199';
  if(m==='car'){
    [[-.5,-.58],[.5,-.58],[-.5,.6],[.5,.6]].forEach(w=>rr(w[0],w[1],.17,.4,.07,'#20242c'));
    sh();rr(0,0,.96,2.05,.3,'#e5483f');ns();
    rr(0,-.66,.72,.52,.2,'#d23a32');
    pg([[-.4,-.34],[.4,-.34],[.33,-.04],[-.33,-.04]],'#2f4a63');
    rr(0,.3,.74,.52,.12,'#ef5a50');
    pg([[-.32,.62],[.32,.62],[.38,.8],[-.38,.8]],'#2f4a63');
    el(-.33,-.97,.11,.06,'#ffe27a');el(.33,-.97,.11,.06,'#ffe27a');
    rr(-.34,.99,.2,.06,.03,'#ffb3ad');rr(.34,.99,.2,.06,.03,'#ffb3ad')}
  else if(m==='bike'){
    ln(0,-.98,0,.98,.15,'#1f2a37');ln(0,-.8,0,.82,.06,'#2bb8c9');ln(-.55,-.56,.55,-.56,.1,'#2bb8c9');
    ln(-.27,-.02,-.52,-.56,.13,SK);ln(.27,-.02,.52,-.56,.13,SK);
    sh();el(0,.16,.32,.46,'#e0457b');ns();
    el(0,-.08,.21,.23,'#3ecf8e');ln(0,-.28,0,.12,.05,'#27a672');ln(-.11,-.2,-.11,.04,.04,'#27a672');ln(.11,-.2,.11,.04,.04,'#27a672')}
  else if(m==='moto'){
    rr(0,-.8,.2,.55,.08,'#1c1f26');rr(0,.82,.27,.6,.1,'#1c1f26');
    sh();rr(0,.05,.44,1.4,.2,'#ffd23f');ns();
    rr(0,-.02,.36,.5,.14,'#e5405e');rr(0,-.78,.34,.2,.07,'#ffd23f');
    ln(-.64,-.5,.64,-.5,.11,'#1c1f26');ln(-.3,-.05,-.58,-.5,.13,SK);ln(.3,-.05,.58,-.5,.13,SK);
    sh();el(0,.2,.36,.46,'#2b8fd6');ns();
    el(0,-.04,.22,.25,'#f4f4f4');rr(0,-.18,.26,.09,.04,'#1c1f26')}
  else if(m==='boat'){
    ln(-.22,1,-.4,1.55,.09,'rgba(255,255,255,.75)');ln(.22,1,.4,1.55,.09,'rgba(255,255,255,.75)');
    sh();X.beginPath();X.moveTo(0,-1.15);X.bezierCurveTo(.55,-.6,.58,.2,.5,.98);X.lineTo(-.5,.98);X.bezierCurveTo(-.58,.2,-.55,-.6,0,-1.15);X.closePath();F('#f4f6f8');ns();
    X.beginPath();X.moveTo(0,-.92);X.bezierCurveTo(.4,-.5,.44,.2,.38,.82);X.lineTo(-.38,.82);X.bezierCurveTo(-.44,.2,-.4,-.5,0,-.92);X.closePath();F('#d9a566');
    rr(0,-.05,.52,.62,.14,'#ffffff');rr(0,-.36,.42,.1,.04,'#2f4a63');rr(0,.58,.5,.2,.06,'#2b8fd6');ln(0,-1.1,0,-1.0,.06,'#e5483f')}
  else if(m==='plane'){
    el(-.52,.02,.1,.22,'#9aa7b8');el(.52,.02,.1,.22,'#9aa7b8');
    sh();pg([[0,-1],[.13,-.42],[.97,.12],[.97,.32],[.13,.02],[.1,.5],[.4,.72],[.4,.88],[0,.76],[-.4,.88],[-.4,.72],[-.1,.5],[-.13,.02],[-.97,.32],[-.97,.12],[-.13,-.42]],'#f7f9fc');ns();
    pg([[.97,.12],[.97,.32],[.8,.27],[.8,.1]],'#2b8fd6');pg([[-.97,.12],[-.97,.32],[-.8,.27],[-.8,.1]],'#2b8fd6');
    pg([[.4,.72],[.4,.88],[.22,.82],[.22,.68]],'#2b8fd6');pg([[-.4,.72],[-.4,.88],[-.22,.82],[-.22,.68]],'#2b8fd6');
    ln(0,-.55,0,.62,.06,'#2b8fd6');el(0,-.76,.07,.12,'#2f4a63')}
  else{
    const ph=Math.sin(performance.now()/170);
    rr(-.2,.5*ph,.22,.5,.1,'#2a2f3a');rr(.2,-.5*ph,.22,.5,.1,'#2a2f3a');
    ln(-.5,0,-.54,-.45*ph,.15,SK);ln(.5,0,.54,.45*ph,.15,SK);
    sh();el(0,0,.52,.27,'#2b8fd6');ns();
    el(0,-.02,.2,.22,'#4a3426');ln(0,-.2,0,-.14,.06,SK)}
  X.restore()}
function badge(h){
  const q=P(h),a=pts[h[2]-1],b=pts[h[2]],T=b?Math.atan2(b[1]-a[1],b[0]-a[0]):0;
  if(A===null)A=T;else{let d=T-A;d=Math.atan2(Math.sin(d),Math.cos(d));A+=d*.18}
  ctx.save();ctx.translate(q[0],q[1]);icon($('mode').value,A);ctx.restore()}
function bounds(){let a=1,b=0,c=1,d=0;pts.forEach(p=>{a=Math.min(a,p[0]);b=Math.max(b,p[0]);c=Math.min(c,p[1]);d=Math.max(d,p[1])});return[a,b,c,d]}
function fitZ(){const[a,b,c,d]=bounds();return Math.max(2,Math.min(16,Math.log2(Math.min(W*.8/(Math.max(b-a,1e-6)*256),H*.7/(Math.max(d-c,1e-6)*256)))))}
function cam(snap){
  if(pts.length<2)return;
  const fz=fitZ();
  if($('cam').value==='g'){const[a,b,c,d]=bounds();z=fz;cx=(a+b)/2;cy=(c+d)/2;return}
  z=Math.min(17,fz+1.8);const h=head();
  if(snap){cx=h[0];cy=h[1]}else{cx+=(h[0]-cx)*.12;cy+=(h[1]-cy)*.12}}
function draw(){
  map();ctx.filter='none';ctx.lineCap=ctx.lineJoin='round';
  const anim=playing||t>0;
  if(pts.length>1){
    if(!anim){path(pts,'#fff',13);path(pts,'#0b6e8a',8)}
    else{path(pts,'rgba(11,110,138,.45)',8);
      const h=head(),a=pts.slice(0,h[2]).concat([[h[0],h[1]]]);path(a,'#fff',14);path(a,'#f2682c',9);badge(h)}}
  if(pts.length&&!anim)pts.forEach((p,i)=>dot(p,i?9:13,i?'#0b6e8a':'#5fd0a5'));
  if(pts.length>1&&anim){dot(pts[0],11,'#5fd0a5');if(t>=1)dot(pts[pts.length-1],11,'#e0393e')}
  const ti=$('title').value;
  if(ti){ctx.font='700 60px system-ui,sans-serif';ctx.textAlign='center';ctx.lineWidth=12;ctx.strokeStyle='rgba(11,42,51,.9)';ctx.strokeText(ti,W/2,130,W-60);ctx.fillStyle='#f4efe4';ctx.fillText(ti,W/2,130,W-60)}
  const at=STY[$('sty').value].a;ctx.font='20px system-ui,sans-serif';ctx.textAlign='left';const aw=ctx.measureText(at).width+16;ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(0,H-30,aw,30);ctx.fillStyle='#234';ctx.fillText(at,8,H-9)}

/* interaction */
const ptr=new Map();let moved=0,pd=0;
const xy=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,xy(e));moved=0;if(ptr.size==2){const[a,b]=[...ptr.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
cv.addEventListener('pointermove',e=>{
  if(!ptr.has(e.pointerId)||playing)return;const o=ptr.get(e.pointerId),n=xy(e);
  if(ptr.size==1){cx-=(n[0]-o[0])/S();cy-=(n[1]-o[1])/S();moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1])}
  ptr.set(e.pointerId,n);
  if(ptr.size==2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)z=Math.max(1,Math.min(18,z+Math.log2(d/pd)));pd=d;moved+=99}
  draw()});
cv.addEventListener('pointerup',e=>{
  const o=xy(e);
  if(ptr.size==1&&moved<12&&drawMode&&!playing){pts.push([cx+(o[0]-W/2)/S(),cy+(o[1]-H/2)/S()]);changed()}
  ptr.delete(e.pointerId);pd=0});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('wheel',e=>{e.preventDefault();z=Math.max(1,Math.min(18,z-e.deltaY/400));draw()},{passive:false});

$('bDraw').onclick=()=>{drawMode=!drawMode;$('bDraw').classList.toggle('on',drawMode)};
$('bUndo').onclick=()=>{pts.pop();changed()};
$('bClear').onclick=()=>{pts=[];changed()};
$('title').oninput=()=>draw();$('sty').onchange=()=>{if($('sty').value==='gm'&&!mglOK)$('msg').textContent='Carte simplifiée en cours de chargement…';draw()};$('mode').onchange=()=>draw();
$('cam').onchange=()=>{if(pts.length>1){t=0;cam(true);draw()}};
$('gpx').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  const d=new DOMParser().parseFromString(await f.text(),'text/xml');
  let n=[...d.querySelectorAll('trkpt')];if(!n.length)n=[...d.querySelectorAll('rtept')];
  let a=n.map(p=>[mx(+p.getAttribute('lon')),my(+p.getAttribute('lat'))]).filter(p=>p[0]==p[0]&&p[1]==p[1]);
  if(a.length<2){$('msg').textContent='Aucun point de trajet trouvé dans ce fichier GPX.';return}
  if(a.length>800){const s=a.length/800,l=a[a.length-1];a=Array.from({length:800},(_,i)=>a[Math.floor(i*s)]);a.push(l)}
  pts=a;changed();z=fitZ();const b=bounds();cx=(b[0]+b[1])/2;cy=(b[2]+b[3])/2;draw();$('msg').textContent=a.length+' points importés.'};

/* animation */
function run(){return new Promise(res=>{
  const D=Math.max(3,+$('dur').value||12)*1000,t0=performance.now();playing=true;t=0;A=null;cam(true);
  (async function f(n){t=Math.min(1,(n-t0)/D);cam();if(vec()){syncMap();await mglFrame()}draw();if(t<1&&playing)requestAnimationFrame(f);else{playing=false;res()}})(t0)})}
$('bPlay').onclick=async()=>{
  if(playing){playing=false;return}
  if(pts.length<2){$('msg').textContent='Placez au moins deux points pour lancer l’animation.';return}
  $('bPlay').classList.add('on');await run();$('bPlay').classList.remove('on')};

$('bRec').onclick=async()=>{
  if(pts.length<2){$('msg').textContent='Placez au moins deux points avant d’exporter.';return}
  if(!window.MediaRecorder){$('msg').textContent='Ce navigateur ne sait pas enregistrer de vidéo. Utilisez Chrome.';return}
  $('bRec').disabled=true;$('dl').hidden=true;$('msg').textContent='Préchargement de la carte…';
  for(let k=0;k<=30;k++){t=k/30;cam(true);if(vec()){syncMap();await mglFrame();await tl()}draw()}
  for(let i=0;i<120&&pend>0;i++)await sleep(100);
  const mt=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const rc=new MediaRecorder(cv.captureStream(30),{mimeType:mt,videoBitsPerSecond:6e6}),ch=[];
  rc.ondataavailable=e=>e.data.size&&ch.push(e.data);
  const done=new Promise(r=>rc.onstop=r);
  $('msg').textContent='Enregistrement en cours… ne quittez pas l’écran.';
  rc.start();await run();await sleep(700);rc.stop();await done;
  const ext=mt.includes('mp4')?'mp4':'webm',a=$('dl');
  a.href=URL.createObjectURL(new Blob(ch,{type:mt}));a.download='trajet.'+ext;a.textContent='Télécharger la vidéo ('+ext+')';a.hidden=false;
  $('msg').textContent='Vidéo prête.';$('bRec').disabled=false};

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
function chips(){
  document.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===$('mode').value));
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('on',b.dataset.s===$('sty').value));
  document.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===$('cam').value))}
(function(){
  const pick=(sel,v)=>{$(sel).value=v;$(sel).dispatchEvent(new Event('change'));chips()};
  [['car','Voiture',46],['bike','Vélo',48],['moto','Moto',46],['boat','Bateau',38],['plane','Avion',50],['walk','À pied',56]].forEach(([m,n,k])=>{
    const b=document.createElement('button'),c=document.createElement('canvas'),x=c.getContext('2d');
    c.width=c.height=112;x.translate(56,m==='boat'?56-.2*k:56);icon(m,-Math.PI/2,x,k);
    b.className='chip';b.dataset.m=m;b.append(c,n);b.onclick=()=>pick('mode',m);$('trChips').append(b)});
  const R='linear-gradient(135deg,transparent 44%,';
  [['gm','Simplifiée',R+'#a9b3d9 44% 54%,transparent 54%),linear-gradient(165deg,#84d5ea 0 40%,#c8f1d8 40%)'],
   ['osm','Détaillée',R+'#fcd6a4 44% 54%,transparent 54%),linear-gradient(165deg,#aad3df 0 35%,#f2efe9 35%)'],
   ['sat','Satellite','linear-gradient(165deg,#2f5d73 0 35%,#5e7a46 35% 70%,#8a7650 70%)']].forEach(([v,n,bg])=>{
    const b=document.createElement('button'),i=document.createElement('i');
    i.style.background=bg;b.className='chip';b.dataset.s=v;b.append(i,n);b.onclick=()=>pick('sty',v);$('stChips').append(b)});
  [['f','Suit'],['g','Globale']].forEach(([v,n])=>{
    const b=document.createElement('button');b.dataset.c=v;b.textContent=n;b.onclick=()=>pick('cam',v);$('camSeg').append(b)});
  $('grip').onclick=()=>$('sheet').classList.toggle('min');
  chips()})();
draw();initVec();
</script>
</body>
